  test_3:
    name: ${{ matrix.engine }} / test / 3
    if: github.repository == 'Sameri11/smooth-app'
    needs: warm_3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        engine: [flutter, bazel]
    env:
      ENGINE: ${{ matrix.engine }}
      SCENARIO: test
      REPETITION: '3'
