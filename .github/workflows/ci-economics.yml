name: Host output materialization

on:
  push:
    branches: [prototype/output-materialization]
    paths:
      - '.github/workflows/ci-economics.yml'
      - 'ci/economics/**'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.bazelrc'
      - '.bazelversion'
      - 'packages/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: host-outputs-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  ENGINE: bazel
  REPETITION: '1'

jobs:
  seed:
    name: bazel / cold / 1
    if: github.repository == 'Sameri11/smooth-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCENARIO: cold
    steps: &workload
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./ci/economics
        with:
          cache-host: ${{ secrets.BAZEL_CACHE_HOST }}
          cache-project: ${{ secrets.BAZEL_CACHE_PROJECT_ID }}
          cache-token: ${{ secrets.BAZEL_CACHE_TOKEN_RW }}

  toplevel_1:
    name: bazel / warm / toplevel / 1
    if: github.repository == 'Sameri11/smooth-app'
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCENARIO: warm
      REMOTE_DOWNLOAD_OUTPUTS: toplevel
      OUTPUT_READER: toplevel-1
    steps: *workload

  all_1:
    name: bazel / warm / all / 1
    if: github.repository == 'Sameri11/smooth-app'
    needs: toplevel_1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCENARIO: warm
      REMOTE_DOWNLOAD_OUTPUTS: all
      OUTPUT_READER: all-1
    steps: *workload

  all_2:
    name: bazel / warm / all / 2
    if: github.repository == 'Sameri11/smooth-app'
    needs: all_1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCENARIO: warm
      REMOTE_DOWNLOAD_OUTPUTS: all
      OUTPUT_READER: all-2
    steps: *workload

  toplevel_2:
    name: bazel / warm / toplevel / 2
    if: github.repository == 'Sameri11/smooth-app'
    needs: all_2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCENARIO: warm
      REMOTE_DOWNLOAD_OUTPUTS: toplevel
      OUTPUT_READER: toplevel-2
    steps: *workload

  toplevel_3:
    name: bazel / warm / toplevel / 3
    if: github.repository == 'Sameri11/smooth-app'
    needs: toplevel_2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCENARIO: warm
      REMOTE_DOWNLOAD_OUTPUTS: toplevel
      OUTPUT_READER: toplevel-3
    steps: *workload

  all_3:
    name: bazel / warm / all / 3
    if: github.repository == 'Sameri11/smooth-app'
    needs: toplevel_3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCENARIO: warm
      REMOTE_DOWNLOAD_OUTPUTS: all
      OUTPUT_READER: all-3
    steps: *workload
