name: Same-runner output comparison

on:
  push:
    branches: [prototype/same-runner-outputs]
    paths:
      - '.github/workflows/ci-economics.yml'
      - 'ci/economics/**'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.bazelrc'
      - '.bazelversion'
      - 'packages/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: host-same-runner-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  ENGINE: bazel
  REPETITION: '1'

jobs:
  seed:
    name: bazel / cold / 1
    if: github.repository == 'Sameri11/smooth-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCENARIO: cold
    steps: &workload
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./ci/economics
        with:
          cache-host: ${{ secrets.BAZEL_CACHE_HOST }}
          cache-project: ${{ secrets.BAZEL_CACHE_PROJECT_ID }}
          cache-token: ${{ secrets.BAZEL_CACHE_TOKEN_RW }}

  reader:
    name: bazel / warm / same runner
    if: github.repository == 'Sameri11/smooth-app'
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCENARIO: warm
      SAME_RUNNER_OUTPUTS: '1'
    steps: *workload
