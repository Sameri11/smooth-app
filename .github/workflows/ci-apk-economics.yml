name: Debug APK feasibility

on:
  push:
    branches: [prototype/debug-apk-economics]
    paths:
      - '.github/workflows/ci-apk-economics.yml'
      - 'ci/apk/**'
      - 'ci/economics/inputs.json'
      - '.bazelversion'
      - 'BUILD.bazel'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'plugin_deps.MODULE.bazel'
      - 'bazel/flutter/**'
      - 'packages/**/BUILD.bazel'
      - 'packages/smooth_app/lib/dart_plugin_registrant.dart'
      - 'packages/smooth_app/android/**'

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  feasibility:
    name: Smooth / debug / x86_64 / correctness
    if: github.repository == 'Sameri11/smooth-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Sameri11/rules_flutter
          ref: 6ab5ab906916abfdbd80d8a843bee87df500766d
          path: .ci-rules
          persist-credentials: false
      - name: Prepare bounded runner storage and Java
        shell: bash
        run: |
          set -euo pipefail
          df -Pk "$RUNNER_TEMP"
          # These preinstalled tools are unused by this disposable Android job.
          sudo rm -rf /usr/share/dotnet /usr/local/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          df -Pk "$RUNNER_TEMP"
          {
            echo "JAVA_HOME=$JAVA_HOME_17_X64"
            echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter"
            echo "PUB_CACHE=$RUNNER_TEMP/cache-state/pub"
            echo "BAZELISK_HOME=$RUNNER_TEMP/cache-state/bazelisk"
            echo "APK_DEADLINE_EPOCH=$(( $(date +%s) + 3300 ))"
          } >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Install verified Flutter and Bazelisk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PUB_CACHE" "$BAZELISK_HOME"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/flutter.tar.xz" \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.8-stable.tar.xz
          echo "0c7e47fc39ef86290b41707d687bdca7f82b277267a6ef74717f8e88ac423de1  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/flutter.tar.xz"
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = 02085feb3f5d8a8156e5e28512b9d99351d510c0
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/bazel" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $RUNNER_TEMP/bazel" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$FLUTTER_ROOT/bin/flutter" --version
          "$FLUTTER_ROOT/bin/flutter" precache --android
      - name: Install Android tools selected by the pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          extension="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          ndk="$(python3 -c 'import pathlib,re,sys; print(re.search(r"val ndkVersion: String = \"([^\"]+)\"", pathlib.Path(sys.argv[1]).read_text()).group(1))' "$extension")"
          api="$(python3 -c 'import pathlib,re,sys; print(re.search(r"val compileSdkVersion: Int = (\d+)", pathlib.Path(sys.argv[1]).read_text()).group(1))' "$extension")"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$api" "build-tools;$api.0.0" "ndk;$ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          df -Pk "$RUNNER_TEMP"
      - name: Build and inspect both debug APKs
        timeout-minutes: 40
        shell: bash
        run: |
          export APK_STEP_DEADLINE_EPOCH=$(( $(date +%s) + 38*60 ))
          python3 ci/apk/economics.py build
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Allocate remaining emulator budget
        id: runtime-budget
        shell: bash
        run: |
          set -euo pipefail
          now="$(date +%s)"
          remaining=$(( APK_DEADLINE_EPOCH - now ))
          minutes=$(( remaining / 60 ))
          if (( minutes > 15 )); then minutes=15; fi
          if (( minutes < 3 )); then
            echo "Insufficient time for an emulator and complete evidence" >&2
            exit 1
          fi
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
          echo "APK_STEP_DEADLINE_EPOCH=$(( now + minutes*60 - 90 ))" >> "$GITHUB_ENV"
      - name: Exercise both apps on one offline emulator
        timeout-minutes: ${{ fromJSON(steps.runtime-budget.outputs.minutes) }}
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 ci/apk/economics.py runtime
      - name: Emit compact evidence without artifact storage
        if: always()
        shell: bash
        env:
          APK_JOB_STATUS: ${{ job.status }}
        run: python3 ci/apk/economics.py emit
      - name: Require complete APK correctness evidence
        if: always()
        shell: bash
        run: python3 ci/apk/economics.py verdict
