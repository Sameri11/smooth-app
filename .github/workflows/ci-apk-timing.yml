name: Debug APK remote output comparison

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/ci-apk-timing.yml'
      - 'ci/apk/timing.py'
      - 'ci/apk/timing_cache.py'
      - 'ci/apk/arms/**'
      - 'MODULE.bazel'
      - 'ci/apk/maven-downloader.cfg'
      - 'MODULE.bazel.lock'

permissions:
  contents: read
  actions: write

concurrency:
  group: apk-timing-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  ENGINE: bazel

jobs:
  bazel-cold:
    name: APK timing / U / cold seed
    if: github.repository == 'Sameri11/smooth-app' && github.ref == 'refs/heads/prototype/apk-maven-pin'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      apk_proof: ${{ steps.build.outputs.apk_proof }}
    env:
      SCENARIO: cold
      APK_ARM: U
      APK_REPO_MODE: R0
      APK_BAZEL_JOBS: '128'
    steps: &workload
      - name: Start required-result clock and isolate state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-timing/home"
          python3 - <<'PY'
          import json, os, pathlib, time
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'apk-timing/workflow-clock.json'
          p.write_text(json.dumps({'job_start_epoch': time.time()}))
          PY
          {
            echo "JAVA_HOME=$JAVA_HOME_17_X64"
            echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter"
            echo "PUB_CACHE=$RUNNER_TEMP/cache-state/pub"
            echo "BAZELISK_HOME=$RUNNER_TEMP/cache-state/bazelisk"
            echo "APK_TIMING_DEADLINE_EPOCH=$(( $(date +%s) + 3300 ))"
            echo "APK_CACHE_KEY=apk-current-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA-bazel-$APK_ARM-cold"
          } >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          df -Pk "$RUNNER_TEMP"
          # These preinstalled tools are not used by this Android workload.
          sudo rm -rf /usr/share/dotnet /usr/local/swift /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Check out frozen rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Sameri11/rules_flutter
          ref: 6ab5ab906916abfdbd80d8a843bee87df500766d
          path: .ci-rules
          persist-credentials: false
      - name: Prepare isolated tracked source
        shell: bash
        run: python3 ci/apk/timing.py prepare --engine "$ENGINE" --scenario "$SCENARIO"
      - name: Start seed restore clock
        if: env.SCENARIO != 'cold'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, time
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'apk-timing/workflow-clock.json'
          d = json.loads(p.read_text()); d['cache_download_start_epoch'] = time.time()
          p.write_text(json.dumps(d))
          PY
      - name: Restore exact arm seed
        if: env.SCENARIO != 'cold'
        id: seed
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/apk-timing-cache
          key: ${{ env.APK_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Verify and unpack exact arm seed
        if: env.SCENARIO != 'cold'
        shell: bash
        env:
          MATCHED_KEY: ${{ steps.seed.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.seed.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$MATCHED_KEY" = "$APK_CACHE_KEY"
          python3 - <<'PY'
          import json, os, pathlib, time
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'apk-timing/workflow-clock.json'
          d = json.loads(p.read_text()); d['cache_download_end_epoch'] = time.time()
          d['cache_hit'] = os.environ['CACHE_HIT'] == 'true'
          d['cache_matched_key'] = os.environ['MATCHED_KEY']
          d['cache_expected_key'] = os.environ['APK_CACHE_KEY']
          p.write_text(json.dumps(d))
          PY
          python3 ci/apk/timing_cache.py restore --engine "$ENGINE" --scenario "$SCENARIO"
          rm -rf "$RUNNER_TEMP/apk-timing-cache"
      - name: Install verified Flutter and Bazelisk
        if: env.SCENARIO == 'cold'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PUB_CACHE" "$BAZELISK_HOME"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/flutter.tar.xz" \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.8-stable.tar.xz
          echo "0c7e47fc39ef86290b41707d687bdca7f82b277267a6ef74717f8e88ac423de1  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/flutter.tar.xz"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/bazel" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $RUNNER_TEMP/bazel" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bazel"
      - name: Verify tools and install pinned Android dependencies
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/apk-timing/home"
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = 02085feb3f5d8a8156e5e28512b9d99351d510c0
          "$FLUTTER_ROOT/bin/flutter" --version
          "$FLUTTER_ROOT/bin/flutter" precache --android
          extension="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          ndk="$(python3 -c 'import pathlib,re,sys; print(re.search(r"val ndkVersion: String = \"([^\"]+)\"", pathlib.Path(sys.argv[1]).read_text()).group(1))' "$extension")"
          api="$(python3 -c 'import pathlib,re,sys; print(re.search(r"val compileSdkVersion: Int = (\d+)", pathlib.Path(sys.argv[1]).read_text()).group(1))' "$extension")"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$api" "build-tools;$api.0.0" "ndk;$ndk"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk"
            echo "APK_TREE_BUILD_TOOLS=$ANDROID_HOME/build-tools/$api.0.0"
            echo "APK_TREE_PLATFORM=$ANDROID_HOME/platforms/android-$api"
          } >> "$GITHUB_ENV"
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          df -Pk "$RUNNER_TEMP"
      - name: Build and validate current APK
        id: build
        shell: bash
        env:
          BAZEL_CACHE_HOST: ${{ secrets.BAZEL_CACHE_HOST }}
          BAZEL_CACHE_PROJECT_ID: ${{ secrets.BAZEL_CACHE_PROJECT_ID }}
          BAZEL_CACHE_TOKEN_RW: ${{ secrets.BAZEL_CACHE_TOKEN_RW }}
        run: |
          root="$RUNNER_TEMP/apk-timing"
          trap 'rm -f "$root/remote-cache.bazelrc" "$root/logs/bep.json" "$root/logs/bazel-profile.json"' EXIT
          python3 ci/apk/timing.py run --engine "$ENGINE" --scenario "$SCENARIO"
      - name: Pack bounded arm seed
        id: pack
        shell: bash
        run: python3 ci/apk/timing_cache.py pack --engine "$ENGINE" --scenario "$SCENARIO"
      - name: Publish exact arm seed
        if: steps.pack.outputs.upload == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pack.outputs.path }}
          key: ${{ steps.pack.outputs.key }}
      - name: Record and bound arm seed cache
        if: always() && env.SCENARIO == 'cold' && steps.pack.outputs.upload == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_KEY: ${{ steps.pack.outputs.key }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" > "$RUNNER_TEMP/apk-cache-after.json"
          python3 - <<'PY'
          import json, os, pathlib, time
          listing=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'apk-cache-after.json').read_text())
          if listing['total_count']>100: raise RuntimeError('Cache listing exceeds one page')
          rows=[c for c in listing['actions_caches'] if c['key']==os.environ['PUBLISHED_KEY']]
          if len(rows)!=1: raise RuntimeError('Exact arm seed cache missing or duplicated')
          row=rows[0]
          if row['size_in_bytes']>3*1024**3: raise RuntimeError('Arm seed cache exceeds 3 GiB')
          total=sum(c['size_in_bytes'] for c in listing['actions_caches'])
          if total>9*1024**3: raise RuntimeError('GitHub cache total exceeds 9 GiB')
          clock=pathlib.Path(os.environ['RUNNER_TEMP'])/'apk-timing/workflow-clock.json'
          data=json.loads(clock.read_text())
          data.update(cache_upload_end_epoch=time.time(),published_cache=row)
          clock.write_text(json.dumps(data))
          print(json.dumps({'key':row['key'],'size_in_bytes':row['size_in_bytes'],'total_bytes':total}))
          PY
      - name: Shut down isolated Bazel server
        if: always()
        shell: bash
        run: |
          root="$RUNNER_TEMP/apk-timing"
          base="$root/bazel-output-base"
          if [[ -x "$RUNNER_TEMP/bazel" && -d "$base/server" ]]; then
            cd "$root/trees/bazel"
            HOME="$root/home" timeout 30 "$RUNNER_TEMP/bazel" --nosystem_rc --nohome_rc --noworkspace_rc \
              --output_base="$base" shutdown
          fi
      - name: Emit compact evidence without artifacts
        if: always()
        shell: bash
        env:
          APK_TIMING_JOB_STATUS: ${{ job.status }}
        run: python3 ci/apk/timing.py emit --engine "$ENGINE" --scenario "$SCENARIO"
      - name: Require valid APK timing evidence
        if: always()
        shell: bash
        env:
          APK_TIMING_JOB_STATUS: ${{ job.status }}
        run: python3 ci/apk/timing.py verify --engine "$ENGINE" --scenario "$SCENARIO"

  warm-u-0:
    name: APK timing / U / warm / 0
