name: Host test worker readiness

on:
  push:
    branches: [prototype/test-compiler-ci]

permissions:
  contents: read

concurrency:
  group: host-test-compiler-comparison
  cancel-in-progress: false

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  ENGINE: bazel

jobs:
  readiness:
    name: Cold host unit tests with the worker
    if: github.repository == 'Sameri11/smooth-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HOST_TIMING_PHASE: readiness
      TEST_KERNEL_COMPILER: worker
      SCENARIO: cold
      REPETITION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./ci/economics
        with:
          cache-host: ${{ secrets.BAZEL_CACHE_HOST }}
          cache-project: ${{ secrets.BAZEL_CACHE_PROJECT_ID }}
          cache-token: ${{ secrets.BAZEL_CACHE_TOKEN_RW }}
