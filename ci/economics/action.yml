name: Host test compiler timing
description: Measure one fresh-runner Bazel test invocation and validate the case inventory.
inputs:
  cache-host:
    description: Remote cache host.
    required: false
  cache-project:
    description: Remote cache project.
    required: false
  cache-token:
    description: Remote cache write token.
    required: false
runs:
  using: composite
  steps:
    - name: Record runner and setup boundary
      shell: bash
      run: |
        {
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter"
          echo "PUB_CACHE=$RUNNER_TEMP/cache-state/pub"
          echo "BAZELISK_HOME=$RUNNER_TEMP/cache-state/bazelisk"
          if [ "$SCENARIO" = cold ]; then
            echo "REMOTE_CACHE_MODE=seed"
          else
            echo "REMOTE_CACHE_MODE=read"
          fi
        } >> "$GITHUB_ENV"
        python3 ci/economics/clock.py begin
    - name: Check out pinned rules
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: Sameri11/rules_flutter
        ref: 6ab5ab906916abfdbd80d8a843bee87df500766d
        path: .ci-rules
        persist-credentials: false
    - name: Install checksum-verified Flutter
      shell: bash
      run: |
        set -euo pipefail
        python3 ci/economics/clock.py sdk-install-start
        read -r version sha < <(jq -er '.flutter | "\(.version) \(.archive_sha256)"' ci/economics/inputs.json)
        archive="$RUNNER_TEMP/flutter.tar.xz"
        curl --fail --location --retry 2 --output "$archive" \
          "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${version}-stable.tar.xz"
        echo "$sha  $archive" | sha256sum --check
        tar -xJf "$archive" -C "$RUNNER_TEMP"
        rm "$archive"
        python3 ci/economics/clock.py sdk-install-end
    - name: Install checksum-verified Bazelisk
      shell: bash
      run: |
        set -euo pipefail
        python3 ci/economics/clock.py bazelisk-install-start
        curl --fail --location --output "$RUNNER_TEMP/bazel" \
          https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
        echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $RUNNER_TEMP/bazel" | sha256sum --check
        chmod +x "$RUNNER_TEMP/bazel"
        python3 ci/economics/clock.py bazelisk-install-end
    - name: Verify installed SDK and expose tools
      shell: bash
      run: |
        set -euo pipefail
        echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = "$(jq -er .flutter.revision ci/economics/inputs.json)"
        "$FLUTTER_ROOT/bin/flutter" --version
        python3 ci/economics/clock.py tools-ready
    - name: Run and gate matched host workload
      shell: bash
      env:
        BAZEL_CACHE_HOST: ${{ inputs.cache-host }}
        BAZEL_CACHE_PROJECT_ID: ${{ inputs.cache-project }}
        BAZEL_CACHE_TOKEN_RW: ${{ inputs.cache-token }}
      run: python3 ci/economics/timing.py run --engine "$ENGINE" --scenario "$SCENARIO" --rep "$REPETITION"
    - name: Prove rejection of broken tests and library
      if: env.HOST_TIMING_PHASE == 'readiness'
      shell: bash
      env:
        BAZEL_CACHE_HOST: ${{ inputs.cache-host }}
        BAZEL_CACHE_PROJECT_ID: ${{ inputs.cache-project }}
        BAZEL_CACHE_TOKEN_RW: ${{ inputs.cache-token }}
      run: |
        python3 ci/economics/clock.py controls-start
        python3 ci/economics/timing.py controls --engine "$ENGINE" --rep "$REPETITION"
        python3 ci/economics/clock.py controls-end
    - name: Remove credentials and raw diagnostics
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/remote-cache.bazelrc" "$RUNNER_TEMP/bep-raw.json" "$RUNNER_TEMP/test-compiler-spawns.jsonl"
    - name: Check compact evidence size
      id: evidence
      if: always()
      shell: bash
      run: python3 ci/economics/clock.py finish
    - name: Retain compact evidence
      if: always() && steps.evidence.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: evidence-${{ env.HOST_TIMING_PHASE }}-${{ env.TEST_KERNEL_COMPILER }}-${{ env.SCENARIO }}-${{ env.REPETITION }}
        path: ${{ runner.temp }}/smooth-ci-evidence
        retention-days: 1
        if-no-files-found: error
        include-hidden-files: true
