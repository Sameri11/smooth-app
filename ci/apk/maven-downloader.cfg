# Try Google's Maven Central mirror before the pinned original Maven hosts.
rewrite repo1.maven.org/maven2/(.*) maven-central.storage-download.googleapis.com/maven2/$1
rewrite repo1.maven.org/maven2/(.*) repo1.maven.org/maven2/$1
rewrite repo.maven.apache.org/maven2/(.*) maven-central.storage-download.googleapis.com/maven2/$1
rewrite repo.maven.apache.org/maven2/(.*) repo.maven.apache.org/maven2/$1
